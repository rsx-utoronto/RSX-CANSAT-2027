[platformio]
src_dir = software/firmware
default_envs = ground_station

[env]
platform = platformio/espressif32@8.0.0
framework = arduino
board = esp32dev
monitor_speed = 115200
lib_deps =
    symlink://software/firmware_lib

[env:ground_station]
build_src_filter =
    -<*>
    +<ground/src/>
build_flags =
    -Isoftware/firmware/ground/include

[env:pq]
build_src_filter =
    -<*>
    +<PQ/src/>
build_flags =
    -Isoftware/firmware/PQ/include

[env:container]
build_src_filter =
    -<*>
    +<container/src/>
build_flags =
    -Isoftware/firmware/container/include
