[platformio]
include_dir = inc

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.04/platform-espressif32.zip
framework = arduino
board = esp32dev
monitor_speed = 115200
upload_port = COM3
monitor_port = COM3
lib_deps =
    adafruit/Adafruit BMP5xx Library